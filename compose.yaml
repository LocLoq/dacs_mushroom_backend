name: dacs-mushroom

x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile.api
  target: production

x-database-environment: &database-environment
  DATABASE_HOST: db
  DATABASE_PORT: "3306"
  DATABASE_USER: ${DB_USER:-mushroom}
  DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
  DATABASE_NAME: ${DB_NAME:-mushroom_management}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
      MARIADB_DATABASE: ${DB_NAME:-mushroom_management}
      MARIADB_USER: ${DB_USER:-mushroom}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  classifier:
    image: dacs-mushroom-classifier:local
    build:
      context: .
      dockerfile: docker/Dockerfile.classifier
    restart: unless-stopped
    init: true
    environment:
      CLASSIFIER_HOST: 0.0.0.0
      CLASSIFIER_PORT: "8001"
      CLASSIFIER_DEVICE: cpu
      CLASSIFIER_SERVICE_TOKEN: ${CLASSIFIER_SERVICE_TOKEN:?Set CLASSIFIER_SERVICE_TOKEN in .env.docker}
      CLASSIFIER_MAX_CONCURRENCY: ${CLASSIFIER_MAX_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)); assert r['status']=='ready'"]
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 12

  db-init:
    image: dacs-mushroom-api:local
    build: *api-build
    restart: "no"
    environment:
      <<: *database-environment
      NODE_ENV: production
    command: ["node", "scripts/init-database.cjs"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: dacs-mushroom-api:local
    build: *api-build
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: "8080"
      API_LISTEN_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      REDIS_URL: redis://redis:6379
      CLASSIFIER_SERVICE_URL: http://classifier:8001
      CLASSIFIER_SERVICE_TOKEN: ${CLASSIFIER_SERVICE_TOKEN:?Set CLASSIFIER_SERVICE_TOKEN in .env.docker}
      CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-120000}
      CLASSIFIER_JOB_ATTEMPTS: ${CLASSIFIER_JOB_ATTEMPTS:-3}
      CLASSIFIER_RETRY_BACKOFF_MS: ${CLASSIFIER_RETRY_BACKOFF_MS:-30000}
      CLASSIFIER_HEALTH_TIMEOUT_MS: ${CLASSIFIER_HEALTH_TIMEOUT_MS:-2000}
      CLASSIFIER_HEALTH_CACHE_MS: ${CLASSIFIER_HEALTH_CACHE_MS:-5000}
      CLASSIFIER_MONITOR_INTERVAL_MS: ${CLASSIFIER_MONITOR_INTERVAL_MS:-10000}
      CLASSIFIER_ENQUEUE_TIMEOUT_MS: ${CLASSIFIER_ENQUEUE_TIMEOUT_MS:-5000}
      CLASSIFIER_QUEUE_WAIT_MS: ${CLASSIFIER_QUEUE_WAIT_MS:-300000}
      CLASSIFIER_MISSING_JOB_GRACE_MS: ${CLASSIFIER_MISSING_JOB_GRACE_MS:-15000}
      CLASSIFIER_PROCESSING_TIMEOUT_MS: ${CLASSIFIER_PROCESSING_TIMEOUT_MS:-150000}
      CLASSIFIER_MONITOR_PAGE_SIZE: ${CLASSIFIER_MONITOR_PAGE_SIZE:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      CLASSIFIER_RATE_LIMIT_MAX: ${CLASSIFIER_RATE_LIMIT_MAX:-10}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      classifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/test').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  database:
  redis:
  uploads:
