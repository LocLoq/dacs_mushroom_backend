services:
  prometheus:
    image: prom/prometheus:v3.3.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: benchmark
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_BENCHMARK_PASSWORD:?Set GRAFANA_BENCHMARK_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/benchmark.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/benchmark.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/benchmark.json:ro
    depends_on: [prometheus]
