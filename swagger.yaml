      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: File hình ảnh của nấm cần phân loại
      responses:
        '202':
          description: Đã tiếp nhận yêu cầu phân loại
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: QUEUED
          
  /api/mushroom-classifier/history:
