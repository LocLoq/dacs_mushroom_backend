openapi: 3.0.0
info:
  title: API Quản lý Nông Trại Nấm
  version: 1.0.0
  description: Tài liệu API cho Hệ thống Quản lý Nuôi trồng Nấm
servers:
  - url: /
    description: Máy chủ đang phục vụ Swagger (tự dùng host và cổng hiện tại)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: "object"
      properties:
        totalItems:
          type: "integer"
        currentPage:
          type: "integer"
          minimum: 1
        totalPages:
          type: "integer"
        pageSize:
          type: "integer"
          minimum: 1
    TaskSubmissionSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["PENDING","APPROVED","REJECTED","CANCELLED"]
        submittedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        reviewedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        submittedAt:
          type: "string"
          format: "date-time"
        reviewedAt:
          type: "string"
          format: "date-time"
          nullable: true
        reason:
          type: "string"
          nullable: true
    TaskSubmission:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["PENDING","APPROVED","REJECTED","CANCELLED"]
        submittedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        reviewedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        submittedAt:
          type: "string"
          format: "date-time"
        reviewedAt:
          type: "string"
          format: "date-time"
          nullable: true
        reason:
          type: "string"
          nullable: true
        taskId:
          type: "string"
          format: "uuid"
        notes:
          type: "string"
          nullable: true
        evidence:
          type: "array"
          items:
            type: "object"
            properties:
              type:
                type: "string"
                enum: ["CARE_LOG","GROWTH_PROGRESS","HARVEST"]
              recordId:
                type: "integer"
                minimum: 1
              record:
                oneOf: [{"$ref":"#/components/schemas/CultivationCareLog"},{"$ref":"#/components/schemas/GrowthProgressRecord"},{"$ref":"#/components/schemas/HarvestRecord"}]
    Task:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum: ["TODO","IN_PROGRESS","PENDING_REVIEW","COMPLETED","CANCELLED"]
        batchId:
          type: "integer"
          nullable: true
        batchCode:
          type: "string"
          nullable: true
        assigneeUserId:
          type: "integer"
          nullable: true
          readOnly: true
        assignee:
          type: "object"
          nullable: true
          properties:
            id:
              type: "integer"
              minimum: 1
            username:
              type: "string"
            full_name:
              type: "string"
            role:
              type: "string"
              enum: ["admin","manager","staff"]
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        dueAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          readOnly: true
        submissions:
          type: "array"
          items:
            $ref: "#/components/schemas/TaskSubmissionSummary"
          description: "List/create/patch: tối đa một lần gửi gần nhất, không có evidence/notes."
    TaskDetail:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum: ["TODO","IN_PROGRESS","PENDING_REVIEW","COMPLETED","CANCELLED"]
        batchId:
          type: "integer"
          nullable: true
        batchCode:
          type: "string"
          nullable: true
        assigneeUserId:
          type: "integer"
          nullable: true
          readOnly: true
        assignee:
          type: "object"
          nullable: true
          properties:
            id:
              type: "integer"
              minimum: 1
            username:
              type: "string"
            full_name:
              type: "string"
            role:
              type: "string"
              enum: ["admin","manager","staff"]
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        dueAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          readOnly: true
        submissions:
          type: "array"
          items:
            $ref: "#/components/schemas/TaskSubmission"
          description: "Toàn bộ lịch sử với snapshot minh chứng."
    TaskSubmissionInput:
      type: "object"
      additionalProperties: false
      required: ["evidence"]
      properties:
        evidence:
          type: "array"
          minItems: 1
          maxItems: 20
          items:
            type: "object"
            additionalProperties: false
            required: ["type","recordId"]
            properties:
              type:
                type: "string"
                enum: ["CARE_LOG","GROWTH_PROGRESS","HARVEST"]
              recordId:
                type: "integer"
                minimum: 1
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
    TaskReviewInput:
      type: "object"
      additionalProperties: false
      required: ["decision"]
      properties:
        decision:
          type: "string"
          enum: ["APPROVE","REJECT"]
        reason:
          type: "string"
          nullable: true
          maxLength: 10000
          description: "Bắt buộc khi REJECT."
    EvidenceCandidate:
      type: "object"
      properties:
        type:
          type: "string"
          enum: ["CARE_LOG","GROWTH_PROGRESS","HARVEST"]
        recordId:
          type: "integer"
          minimum: 1
        record:
          oneOf: [{"$ref":"#/components/schemas/CultivationCareLog"},{"$ref":"#/components/schemas/GrowthProgressRecord"},{"$ref":"#/components/schemas/HarvestRecord"}]
    ExpenseInput:
      type: "object"
      additionalProperties: false
      required: ["name","category","quantity","unit","unitPrice"]
      properties:
        name:
          type: "string"
          maxLength: 255
        category:
          type: "string"
          enum: ["MATERIAL","TOOL","FERTILIZER","OTHER"]
        quantity:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        unit:
          type: "string"
          maxLength: 50
        unitPrice:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        incurredAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
    ExpenseUpdateInput:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          maxLength: 255
        category:
          type: "string"
          enum: ["MATERIAL","TOOL","FERTILIZER","OTHER"]
        quantity:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        unit:
          type: "string"
          maxLength: 50
        unitPrice:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        incurredAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
    SaleInput:
      type: "object"
      additionalProperties: false
      required: ["quantityKg","unitPrice"]
      properties:
        quantityKg:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        unitPrice:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        soldAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        buyer:
          type: "string"
          nullable: true
          maxLength: 255
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
    SaleUpdateInput:
      type: "object"
      additionalProperties: false
      properties:
        quantityKg:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        unitPrice:
          oneOf: [{"type":"string","pattern":"^\\d+(\\.\\d+)?$"},{"type":"number","minimum":0}]
          description: "Đơn giá tối đa 2 chữ số thập phân; số lượng dương, tối đa 3 chữ số thập phân."
        soldAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        buyer:
          type: "string"
          nullable: true
          maxLength: 255
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
    BatchExpense:
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 255
        category:
          type: "string"
          enum: ["MATERIAL","TOOL","FERTILIZER","OTHER"]
        quantity:
          type: "string"
        unit:
          type: "string"
          maxLength: 50
        unitPrice:
          type: "string"
        incurredAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
        id:
          type: "integer"
          minimum: 1
        batchId:
          type: "integer"
          minimum: 1
        amount:
          type: "string"
          readOnly: true
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    BatchSale:
      type: "object"
      properties:
        quantityKg:
          type: "string"
        unitPrice:
          type: "string"
        soldAt:
          type: "string"
          format: "date-time"
          description: "Mặc định hiện tại khi tạo; cũng chấp nhận YYYY-MM-DD."
        buyer:
          type: "string"
          nullable: true
          maxLength: 255
        notes:
          type: "string"
          nullable: true
          maxLength: 10000
        id:
          type: "integer"
          minimum: 1
        batchId:
          type: "integer"
          minimum: 1
        amount:
          type: "string"
          readOnly: true
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    FinancialSummary:
      type: "object"
      properties:
        currency:
          type: "string"
          enum: ["VND"]
        totalHarvestKg:
          type: "number"
        totalSoldKg:
          type: "number"
        revenue:
          type: "string"
        totalCost:
          type: "string"
        profit:
          type: "string"
        costsByCategory:
          type: "object"
          properties:
            MATERIAL:
              type: "string"
            TOOL:
              type: "string"
            FERTILIZER:
              type: "string"
            OTHER:
              type: "string"
        profitMarginPercent:
          type: "string"
          nullable: true
        costPerHarvestKg:
          type: "string"
          nullable: true
    FinancialSeriesPoint:
      type: "object"
      properties:
        period:
          type: "string"
        revenue:
          type: "string"
        totalCost:
          type: "string"
        profit:
          type: "string"
    FinancialReportRow:
      type: "object"
      properties:
        batchId:
          type: "integer"
          minimum: 1
        batchCode:
          type: "string"
        status:
          type: "string"
        facility:
          type: "string"
        mushroom:
          type: "string"
        currency:
          type: "string"
          enum: ["VND"]
        totalHarvestKg:
          type: "number"
        totalSoldKg:
          type: "number"
        revenue:
          type: "string"
        totalCost:
          type: "string"
        profit:
          type: "string"
        costsByCategory:
          type: "object"
          properties:
            MATERIAL:
              type: "string"
            TOOL:
              type: "string"
            FERTILIZER:
              type: "string"
            OTHER:
              type: "string"
        profitMarginPercent:
          type: "string"
          nullable: true
        costPerHarvestKg:
          type: "string"
          nullable: true
        series:
          type: "array"
          items:
            $ref: "#/components/schemas/FinancialSeriesPoint"
    GalleryImage:
      type: "object"
      properties:
        id:
          type: "integer"
          minimum: 1
        facilityId:
          type: "integer"
          minimum: 1
        mushroomId:
          type: "integer"
          minimum: 1
        batchId:
          type: "integer"
          minimum: 1
        imageUrl:
          type: "string"
        originalName:
          type: "string"
        mimeType:
          type: "string"
        fileSize:
          type: "integer"
        caption:
          type: "string"
          nullable: true
          maxLength: 500
        isCover:
          type: "boolean"
        uploadedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"
    GalleryImageUpdateInput:
      type: "object"
      additionalProperties: false
      properties:
        caption:
          type: "string"
          nullable: true
          maxLength: 500
        isCover:
          type: "boolean"
          enum: [true]
    TaskCreateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        batchId:
          type: integer
          nullable: true
        assigneeUserId:
          type: integer
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
      required: [title]
    TaskUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        batchId:
          type: integer
          nullable: true
        assigneeUserId:
          type: integer
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [TODO, IN_PROGRESS, CANCELLED]
    Mushroom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scientificName:
          type: string
        commonName:
          type: string
        otherNames:
          type: string
        family:
          type: string
        genus:
          type: string
        capDescription:
          type: string
        gillsDescription:
          type: string
        stemDescription:
          type: string
        sporePrintColor:
          type: string
        bruisingBehavior:
          type: string
        ecologyType:
          type: string
          enum: [SAPROBIC, MYCORRHIZAL, PARASITIC]
        habitat:
          type: string
        fruitingSeason:
          type: string
        edibilityStatus:
          type: string
          enum: [CHOICE, EDIBLE, INEDIBLE, POISONOUS, DEADLY]
        toxicitySymptoms:
          type: string
        medicinalProperties:
          type: string
        cultivationDifficulty:
          type: string
          enum: [EASY, MEDIUM, HARD, UNCULTIVABLE]
        imageUrl:
          type: string
        coverImageUrl:
          type: "string"
          nullable: true
          readOnly: true
        imageCount:
          type: "integer"
          readOnly: true
    ProductionFacility:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        taxCode:
          type: string
        address:
          type: string
        province:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        facilityType:
          type: string
          enum: [HOUSEHOLD, COOPERATIVE, ENTERPRISE]
        capacityTonsPerYear:
          type: number
        totalAreaSqm:
          type: number
        certifications:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        mushrooms:
          type: array
          items:
            type: integer
        coverImageUrl:
          type: "string"
          nullable: true
          readOnly: true
        imageCount:
          type: "integer"
          readOnly: true
    CultivationBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        batchCode:
          type: string
        facilityId:
          type: integer
        mushroomId:
          type: integer
        status:
          type: string
          enum: [PREPARATION, INCUBATION, FRUITING, HARVESTING, COMPLETED, FAILED]
        substrateType:
          type: string
        spawnSource:
          type: string
        bagQuantity:
          type: integer
        startDate:
          type: string
          format: date-time
        expectedHarvestDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        actualYieldKg:
          type: number
        defectRate:
          type: number
        notes:
          type: string
        coverImageUrl:
          type: "string"
          nullable: true
          readOnly: true
        imageCount:
          type: "integer"
          readOnly: true
    CultivationCareLog:
      type: object
      properties:
        id:
          type: integer
        batchId:
          type: integer
        actionType:
          type: string
        notes:
          type: string
        recordedAt:
          type: string
          format: date-time
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
    GrowthProgressRecord:
      type: object
      required: [id, batchId, stage, notes, recordedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          readOnly: true
        batchId:
          type: integer
          readOnly: true
        stage:
          type: string
        notes:
          type: string
        recordedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/GrowthProgressImage'
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
    GrowthProgressImage:
      type: object
      required: [id, growthProgressId, imageUrl, originalName, mimeType, fileSize, createdAt]
      properties:
        id:
          type: integer
          readOnly: true
        growthProgressId:
          type: integer
          readOnly: true
        imageUrl:
          type: string
          description: Duong dan cong khai cua anh thuc te
        originalName:
          type: string
        mimeType:
          type: string
          example: image/jpeg
        fileSize:
          type: integer
          description: Kich thuoc tep tinh bang byte
        createdAt:
          type: string
          format: date-time
          readOnly: true
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        error:
          type: string
    ClassifierLookup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, PROCESSING, SUCCEEDED, FAILED]
        originalName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        predictedName:
          type: string
          nullable: true
        edibility:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
        result:
          type: object
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        actorUsername:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        createdAt:
          type: string
          format: date-time
    HarvestRecord:
      type: object
      properties:
        id:
          type: integer
        batchId:
          type: integer
        harvestedAt:
          type: string
          format: date-time
        totalYieldKg:
          type: number
        qualityGrade:
          type: string
        notes:
          type: string
        createdByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
  parameters:
    ReportFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Ngày bắt đầu, mặc định là đầu năm hiện tại
    ReportTo:
      name: to
      in: query
      schema: { type: string, format: date }
      description: Ngày kết thúc, mặc định là hôm nay
    FacilityId:
      name: facilityId
      in: query
      schema: { type: integer }
    MushroomId:
      name: mushroomId
      in: query
      schema: { type: integer }
    GroupBy:
      name: groupBy
      in: query
      schema: { type: string, enum: [day, month], default: month }
security:
  - bearerAuth: []
paths:
