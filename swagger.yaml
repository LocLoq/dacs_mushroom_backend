              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Tên đăng nhập
                must_change_password:
                  type: boolean
                  default: false
                  description: Buộc đổi mật khẩu trước khi dùng API nội bộ
                password:
                  type: string
                  description: Mật khẩu
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '200':
          description: Đăng nhập thành công, trả về JWT token
        '401':
          description: Tên đăng nhập hoặc mật khẩu không chính xác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/mushroom-classifier/classify:
    post:
      summary: Tải ảnh nấm lên để AI phân loại
      description: |
        Giới hạn riêng 10 yêu cầu/phút, chặn trước upload. Kiểm tra Redis và Python
        trước khi tiếp nhận; lỗi dependency hoặc enqueue trả 503. Job đã nhận
        chạy tối đa 3 lần với thời gian chờ retry 30/60 giây. Lỗi ảnh, token,
        model/cấu hình hoặc response không hợp lệ không được retry.
        Socket.IO: subscribe_job(jobId), processing, retrying, finished, failed.
        retrying gồm jobId, status=QUEUED, attempt, maxAttempts, retryDelayMs, message.
      tags: [Phân loại Nấm]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: File hình ảnh của nấm cần phân loại
      responses:
        default:
          $ref: '#/components/responses/ApiError'
        '429':
          description: Vượt hạn mức nhận diện hoặc hạn mức API chung
          headers:
            Retry-After:
              description: Số giây cần chờ trước khi gửi lại
              schema: { type: integer }
            RateLimit:
              description: Hạn mức và số yêu cầu còn lại theo từng chính sách
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { code: RATE_LIMITED, message: 'Bạn đã gửi quá nhiều yêu cầu, vui lòng thử lại sau' }
        '503':
          description: Redis hoặc Python không sẵn sàng; code QUEUE_UNAVAILABLE hoặc CLASSIFIER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '202':
          description: Đã tiếp nhận yêu cầu phân loại
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: QUEUED
          
  /api/mushroom-classifier/history:
    get:
      summary: Xem lịch sử tra cứu mushroom classifier
