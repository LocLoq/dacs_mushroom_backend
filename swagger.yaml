  /api/cultivation-batches/{id}/growth-progress/{recordId}:
    patch:
      summary: Cập nhật một bản ghi tiến độ sinh trưởng
      tags: [Quản lý Lô Nuôi Trồng]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của lô nuôi trồng
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
          description: ID của bản ghi tiến độ sinh trưởng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                stage:
                  type: string
                  description: Giai đoạn sinh trưởng mới
                notes:
                  type: string
                  description: Mô tả chi tiết mới
                recordedAt:
                  type: string
                  format: date-time
                  description: Thời điểm ghi nhận mới
          multipart/form-data:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                stage:
                  type: string
                notes:
                  type: string
                recordedAt:
                  type: string
                  format: date-time
                images:
                  type: array
                  description: Ảnh mới được thêm vào bản ghi hiện có; tối đa 5 ảnh mỗi lần
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Cập nhật bản ghi tiến độ sinh trưởng thành công
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/GrowthProgressRecord'
        '400':
          description: ID, dữ liệu hoặc thời điểm ghi nhận không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa cung cấp token xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token không hợp lệ, hết hạn hoặc không đủ quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy lô nuôi trồng hoặc bản ghi tiến độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

