openapi: 3.0.0
info:
  title: API Quản lý Nông Trại Nấm
  version: 1.0.0
  description: |
    Tài liệu API cho Hệ thống Quản lý Nuôi trồng Nấm.
    Lỗi HTTP dùng JSON {code, message}; lỗi 500 không trả chi tiết nội bộ.
    ID số và page/limit phải là số nguyên dương an toàn; dữ liệu sai trả 400.
    Phân trang mặc định page=1, limit=10, tối đa 50; audit log, lịch sử classifier
    và báo cáo dùng limit=20, tối đa 100. Limit vượt mức được giới hạn về mức tối đa.
    Ngày nhận YYYY-MM-DD hoặc ISO 8601 có múi giờ; ngày không tồn tại bị từ chối.
    Bộ lọc ngày báo cáo dùng đầu/cuối ngày tại Việt Nam (UTC+07:00), tối đa 5 năm.
    Body phải là object và chỉ chứa field được hỗ trợ; PATCH growth-progress
    cho phép body rỗng khi có ảnh. ID công việc, submission và classifier là chuỗi UUID.
    Xung đột Prisma P2002/P2003/P2025/P2034 mặc định trả 409 STATE_CONFLICT.
    Rate limit mặc định 300 yêu cầu/phút cho /api, riêng nhận diện 10 yêu cầu/phút;
    theo tài khoản đã xác thực hoặc IP khách. /api/test và OPTIONS được miễn.
    Vượt hạn mức trả 429 RATE_LIMITED kèm Retry-After, RateLimit và RateLimit-Policy.
servers:
  - url: /
    description: Máy chủ đang phục vụ Swagger (tự dùng host và cổng hiện tại)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthProfile:
      type: object
      required: [id, username, role, must_change_password]
      properties:
        id: { type: integer }
        username: { type: string }
        full_name: { type: string }
        email: { type: string }
        phone_number: { type: string }
        role: { type: string, enum: [admin, manager, staff] }
        must_change_password: { type: boolean, default: false }
    Pagination:
      type: "object"
      properties:
        totalItems:
          type: "integer"
        currentPage:
          type: "integer"
          minimum: 1
        totalPages:
          type: "integer"
        pageSize:
          type: "integer"
          minimum: 1
    TaskSubmissionSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["PENDING","APPROVED","REJECTED","CANCELLED"]
        submittedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        reviewedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        submittedAt:
          type: "string"
          format: "date-time"
        reviewedAt:
          type: "string"
          format: "date-time"
          nullable: true
        reason:
          type: "string"
          nullable: true
    TaskSubmission:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["PENDING","APPROVED","REJECTED","CANCELLED"]
        submittedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        reviewedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
        submittedAt:
          type: "string"
          format: "date-time"
        reviewedAt:
          type: "string"
          format: "date-time"
          nullable: true
        reason:
          type: "string"
          nullable: true
        taskId:
          type: "string"
          format: "uuid"
        notes:
          type: "string"
          nullable: true
        evidence:
          type: "array"
          items:
            type: "object"
            properties:
              type:
                type: "string"
                enum: ["CARE_LOG","GROWTH_PROGRESS","HARVEST"]
              recordId:
                type: "integer"
                minimum: 1
              record:
                oneOf: [{"$ref":"#/components/schemas/CultivationCareLog"},{"$ref":"#/components/schemas/GrowthProgressRecord"},{"$ref":"#/components/schemas/HarvestRecord"}]
    Task:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum: ["TODO","IN_PROGRESS","PENDING_REVIEW","COMPLETED","CANCELLED"]
        batchId:
