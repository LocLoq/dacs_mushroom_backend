      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum: ["TODO","IN_PROGRESS","PENDING_REVIEW","COMPLETED","CANCELLED"]
        batchId:
          type: "integer"
          nullable: true
        batchCode:
          type: "string"
          nullable: true
        assigneeUserId:
          type: "integer"
          nullable: true
          readOnly: true
