  /api/auth/change-password:
    post:
      summary: Đổi mật khẩu của tài khoản đang đăng nhập
      description: Cho phép phiên buộc đổi mật khẩu. API nội bộ khác trả 403 PASSWORD_CHANGE_REQUIRED. Kiểm tra mật khẩu hiện tại, mật khẩu mới không rỗng và khác mật khẩu cũ; thành công vô hiệu token cũ.
      tags: [Xác thực]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1, writeOnly: true }
                new_password: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200':
          description: Đổi thành công; lưu token mới trước khi gọi API tiếp theo
          content:
            application/json:
              schema:
                type: object
                required: [message, token, data]
                properties:
                  message: { type: string }
                  token: { type: string }
                  data: { $ref: '#/components/schemas/AuthProfile' }
        '400': { description: Mật khẩu hiện tại sai hoặc mật khẩu mới không hợp lệ; giữ phiên }
        '401': { description: Token không hợp lệ }
        '409': { description: Tài khoản đã được cập nhật đồng thời; đăng nhập lại }

