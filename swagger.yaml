      summary: Xem lịch sử tra cứu mushroom classifier
      tags: [Phân loại Nấm]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [QUEUED, PROCESSING, SUCCEEDED, FAILED] }
        - name: predictedName
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
