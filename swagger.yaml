          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        actorUsername:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        createdAt:
          type: string
          format: date-time
    HarvestRecord:
      type: object
