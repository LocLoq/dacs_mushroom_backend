          nullable: true
          readOnly: true
        updatedByUserId:
          type: "integer"
          nullable: true
          readOnly: true
  responses:
    ApiError:
      description: Lỗi API theo HTTP status; code nghiệp vụ và message được trả trong JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
